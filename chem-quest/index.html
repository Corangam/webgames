<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f7fa">
<title>化学闯关 · 九年级化学</title>
<style>
/* ===== 蜡笔画 · 马卡龙配色 ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --pink:#FFB6C9;      /* 马卡龙粉 */
  --pink-d:#FF8FB1;
  --orange:#FFC48C;    /* 马卡龙橙 */
  --orange-d:#FFA85C;
  --blue:#A9D3F5;      /* 马卡龙蓝 */
  --blue-d:#7BB8EC;
  --mint:#B8E8D8;      /* 薄荷绿 */
  --lemon:#FFF0B3;     /* 柠檬黄 */
  --lav:#D9CBF5;       /* 薰衣草 */
  --ink:#6B5B73;       /* 蜡笔深色（不用纯黑） */
  --ink-l:#9D8FA6;
  --paper:#FFFBF5;     /* 米白纸 */
}

/* ===== 蜡笔涂抹纹理（可复用的 noise） ===== */
/* 用多层 radial + conic 叠出蜡笔颗粒与不均匀覆盖 */
@keyframes crayon-sway{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg)}}

body{
  font-family:"Comic Sans MS","Chalkboard SE","PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,182,201,.35) 0%, transparent 42%),
    radial-gradient(circle at 88% 15%, rgba(169,211,245,.35) 0%, transparent 40%),
    radial-gradient(circle at 20% 88%, rgba(184,232,216,.30) 0%, transparent 45%),
    radial-gradient(circle at 82% 82%, rgba(255,196,140,.32) 0%, transparent 45%),
    linear-gradient(160deg,#FFFBF5 0%,#FDF6EE 100%);
  color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:16px;overflow-x:hidden;
}

.app{width:100%;max-width:440px;position:relative}

/* 蜡笔纸卡片：视觉在 ::before（可扭曲），文字在上层（保持清晰） */
.card{
  position:relative;
  padding:26px 22px;
  animation:fadeIn .3s ease;
  isolation:isolate;
}
.card::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:
    repeating-linear-gradient(104deg,
      rgba(255,255,255,.92) 0px, rgba(255,255,255,.58) 2px,
      rgba(255,248,240,.96) 4px, rgba(255,255,255,.72) 7px),
    var(--paper);
  border:3.5px solid #D9C9B8;
  border-radius:30px 22px 32px 24px / 24px 30px 22px 32px;
  box-shadow:
    7px 8px 0 rgba(107,91,115,.13),
    inset 0 0 44px rgba(255,255,255,.6);
  filter:url(#cr-rough);
}
/* 纸纹颗粒：叠在视觉层之上、文字之下 */
.card::after{
  content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;
  border-radius:30px 22px 32px 24px / 24px 30px 22px 32px;
  background-image:radial-gradient(rgba(107,91,115,.05) 1px, transparent 1px);
  background-size:6px 6px;opacity:.5;
}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.88);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.4)}}
@keyframes wobble{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}

/* 标题：蜡笔手写感 */
.title{
  font-size:34px;font-weight:800;text-align:center;letter-spacing:4px;
  color:#FF6FA0;
  -webkit-text-stroke:1.2px #fff;
  paint-order:stroke fill;
  text-shadow:
    2px 2px 0 #FFC2D6,
    4px 4px 0 rgba(255,111,160,.25),
    6px 6px 0 rgba(107,91,115,.08);
  transform:rotate(-1.4deg);
  margin-bottom:8px;
  animation:wobble 4.5s ease-in-out infinite;
}
.sub{text-align:center;font-size:13px;color:var(--ink-l);margin-bottom:20px;line-height:1.5}

/* 统计块 */
.stat-row{display:flex;gap:10px;margin-bottom:18px}
.stat{
  flex:1;position:relative;isolation:isolate;
  padding:13px 8px;text-align:center;
}
.stat::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:
    repeating-linear-gradient(100deg, rgba(255,255,255,.9) 0px, rgba(253,250,255,.66) 3px, rgba(255,255,255,.86) 6px),
    #fff;
  border:2.5px solid var(--blue);
  border-radius:17px 13px 18px 14px;
  box-shadow:3.5px 3.5px 0 rgba(169,211,245,.5);
  filter:url(#cr-rough-sm);
}
.stat:nth-child(2){border-color:var(--orange);box-shadow:3px 3px 0 rgba(255,196,140,.5)}
.stat:nth-child(3){border-color:var(--pink);box-shadow:3px 3px 0 rgba(255,182,201,.5)}
.stat .n{font-size:21px;font-weight:800;color:var(--blue-d);line-height:1.2}
.stat:nth-child(2) .n{color:var(--orange-d)}
.stat:nth-child(3) .n{color:var(--pink-d)}
.stat .l{font-size:11px;color:var(--ink-l);margin-top:3px}

.sect{font-size:13px;color:var(--ink);font-weight:800;margin:0 0 9px 2px}

/* 单元 chips */
.chips{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:16px}
.chip{
  padding:9px 4px;
  background:transparent;border:none;
  font-size:12.5px;color:var(--ink-l);font-weight:700;text-align:center;
  cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap;
  position:relative;isolation:isolate;
}
.chip::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:
    repeating-linear-gradient(98deg, rgba(255,255,255,.9) 0px, rgba(253,250,255,.65) 3px, rgba(255,255,255,.85) 6px),
    #fff;
  border:2.5px solid #DED2EC;
  border-radius:13px 10px 14px 11px;
  box-shadow:2.5px 2.5px 0 rgba(107,91,115,.08);
  filter:url(#cr-rough-sm);
}
.chip:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(107,91,115,.06)}
.chip.on{color:#D64A80}
.chip.on::before{
  background:
    repeating-linear-gradient(98deg, rgba(255,255,255,.5) 0px, rgba(255,240,246,.3) 3px, rgba(255,255,255,.45) 6px),
    linear-gradient(135deg,#FFD3E2,#FFBBD2);
  border-color:#FF7BA8;
  box-shadow:3px 3px 0 rgba(255,123,168,.4);
}

/* 掌握规则条 */
.rule{
  font-size:11.5px;color:var(--ink-l);line-height:1.65;
  margin:-4px 0 11px 2px;padding:8px 11px;
  position:relative;isolation:isolate;
}
.rule::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:#FFF9E8;border:2px dashed var(--lemon);border-radius:12px;
  filter:url(#cr-rough-sm);
}
.rule b{color:var(--orange-d);font-weight:800}

/* 掌握卡片 */
.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.key{
  background:transparent;border:none;
  padding:11px 6px 13px;text-align:center;cursor:pointer;transition:all .15s;
  position:relative;overflow:hidden;font-family:inherit;width:100%;
  isolation:isolate;
}
.key::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:
    repeating-linear-gradient(102deg, rgba(255,255,255,.92) 0px, rgba(253,250,255,.68) 3px, rgba(255,255,255,.88) 6px),
    #fff;
  border:2.5px solid #DED2EC;border-radius:17px 13px 18px 14px;
  box-shadow:3px 3px 0 rgba(107,91,115,.08);
  filter:url(#cr-rough-sm);
}
.key:active{transform:translate(1px,2px)}
.key:active::before{box-shadow:1px 1px 0 rgba(107,91,115,.08)}
.key.on::before{
  background:
    repeating-linear-gradient(102deg, rgba(255,255,255,.55) 0px, rgba(240,249,255,.35) 3px, rgba(255,255,255,.5) 6px),
    linear-gradient(135deg,#E0F1FF,#C9E4FF);
  border-color:#7FBBEB;
  box-shadow:4px 4px 0 rgba(127,187,235,.4);
}
.key .t{font-size:12px;color:var(--ink-l);font-weight:700}
.key .v{font-size:17px;font-weight:800;color:#5FA8DE;margin-top:2px}
.key:nth-child(3n+1) .v{color:#E0568A}
.key:nth-child(3n+2) .v{color:#F0954A}
.key .d{font-size:10.5px;color:#B5A9BD;margin-top:2px}
.key .bar2{
  position:absolute;left:0;bottom:0;height:4px;
  background:linear-gradient(90deg,var(--pink),var(--orange),var(--blue));
  transition:width .3s ease;border-radius:0 4px 4px 0;
}

/* 按钮：蜡笔粗描边 */
.btn{
  display:block;width:100%;padding:16px;
  border:none;background:transparent;
  font-size:16.5px;font-weight:800;color:#fff;cursor:pointer;
  position:relative;isolation:isolate;
  transition:transform .1s;font-family:inherit;
  text-shadow:1.5px 1.5px 0 rgba(190,70,110,.35);
}
.btn::before{
  content:'';position:absolute;inset:0;z-index:-1;
  border:3px solid #fff;border-radius:20px 16px 21px 17px;
  pointer-events:none;
  background:
    repeating-linear-gradient(96deg,
      rgba(255,255,255,.34) 0px, rgba(255,255,255,.12) 3px,
      rgba(255,255,255,.30) 6px, rgba(255,255,255,.08) 9px),
    linear-gradient(135deg,#FF9EBE,#FF7BA8);
  box-shadow:4px 5px 0 rgba(107,91,115,.18);
  transition:transform .1s,box-shadow .1s;
  filter:url(#cr-rough-sm);
}
.btn:active{transform:translate(2px,3px)}
.btn:active::before{box-shadow:1px 1px 0 rgba(107,91,115,.18)}
.btn.ghost{color:#5C4A66;margin-top:10px;font-size:15px;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.btn.ghost::before{
  background:
    repeating-linear-gradient(96deg,
      rgba(255,255,255,.62) 0px, rgba(255,255,255,.30) 3px,
      rgba(255,255,255,.55) 6px, rgba(255,255,255,.26) 9px),
    linear-gradient(135deg,#CFE8FF,#B4D8F7);
  box-shadow:4px 5px 0 rgba(107,91,115,.14);
}
.btn.ghost:nth-of-type(3)::before{
  background:
    repeating-linear-gradient(96deg, rgba(255,255,255,.62) 0px, rgba(255,255,255,.30) 3px, rgba(255,255,255,.55) 6px, rgba(255,255,255,.26) 9px),
    linear-gradient(135deg,#FFE0BE,#FFD0A2);
}
.btn.ghost:nth-of-type(4)::before{
  background:
    repeating-linear-gradient(96deg, rgba(255,255,255,.62) 0px, rgba(255,255,255,.30) 3px, rgba(255,255,255,.55) 6px, rgba(255,255,255,.26) 9px),
    linear-gradient(135deg,#E3D8FA,#D3C4F5);
}
.btn.sm{padding:10px;font-size:14px;margin-top:0;width:auto}

/* 答题页 */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.progress{font-size:13px;color:var(--ink-l);font-weight:800}
.combo{font-size:13px;font-weight:800;color:#F0954A;opacity:0;transition:opacity .2s}
.combo.on{opacity:1}
.bar{
  height:10px;background:#F3EDF7;border-radius:99px;overflow:hidden;margin-bottom:20px;
  border:2px solid #EADFF2;
}
.bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--pink),var(--orange),var(--blue));
  transition:width .3s ease;
}
.cat{
  display:inline-block;font-size:11.5px;padding:4px 11px;border-radius:8px;
  background:#FFE8F0;color:#E0568A;font-weight:800;margin-bottom:12px;
  border:2px solid #FFD0DF;
}
.qtext{
  font-size:21px;font-weight:800;line-height:1.55;margin-bottom:22px;
  min-height:56px;word-break:break-word;color:var(--ink);
}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  padding:15px 18px;
  background:transparent;border:none;
  font-size:17px;cursor:pointer;transition:all .15s;text-align:left;font-family:inherit;
  color:var(--ink);font-weight:700;word-break:break-word;
  position:relative;isolation:isolate;
}
.opt::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:
    repeating-linear-gradient(100deg,
      rgba(255,255,255,.95) 0px, rgba(252,248,255,.7) 3px,
      rgba(255,255,255,.9) 6px, rgba(250,246,255,.75) 9px),
    #fff;
  border:2.5px solid #DED2EC;
  border-radius:18px 13px 19px 14px / 13px 18px 14px 19px;
  box-shadow:3px 3px 0 rgba(107,91,115,.08);
  filter:url(#cr-rough-sm);
  transition:all .15s;
}
.opt:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(107,91,115,.06)}
.opt.right{color:#2E8B62;font-weight:800}
.opt.right::before{
  background:
    repeating-linear-gradient(100deg, rgba(255,255,255,.55) 0px, rgba(223,247,236,.35) 3px, rgba(255,255,255,.5) 6px),
    linear-gradient(135deg,#DFF7EC,#C8F0DF);
  border-color:#6FCFA8;
  box-shadow:3px 3px 0 rgba(111,207,168,.4);
  animation:pop .3s;
}
.opt.wrong{color:#D45B5B}
.opt.wrong::before{
  background:
    repeating-linear-gradient(100deg, rgba(255,255,255,.5) 0px, rgba(255,228,228,.35) 3px, rgba(255,255,255,.45) 6px),
    linear-gradient(135deg,#FFE4E4,#FFD2D2);
  border-color:#FF9E9E;
  box-shadow:3px 3px 0 rgba(255,158,158,.4);
  animation:shake .35s;
}
.opt.dim{opacity:.42}
.opt:disabled{cursor:default}

/* 反馈 */
.fb{
  margin-top:16px;padding:13px 16px;border-radius:14px 11px 15px 12px;font-size:15px;line-height:1.55;
  display:none;animation:fadeIn .22s;font-weight:700;
}
.fb.show{display:block}
.fb.ok{background:#E8FBF2;color:#2E8B62;border:2.5px solid #6FCFA8}
.fb.no{background:#FFF6EE;color:#C98A6A;border:2.5px solid #F5C9A8}
.fb b{font-weight:800}
.fb .why{display:block;margin-top:6px;font-size:13.5px;opacity:.85;font-weight:600}

/* 答对飘字 */
.floater{
  position:fixed;pointer-events:none;font-weight:800;font-size:24px;
  color:#54C79B;text-shadow:2px 2px 0 #fff,3px 3px 0 rgba(111,207,168,.32);
  animation:floatUp .9s ease-out forwards;z-index:99;
}

/* ===== 蜡笔粉末粒子 ===== */
.powder{
  position:fixed;pointer-events:none;z-index:98;
  width:7px;height:7px;border-radius:50% 40% 55% 45%;
  animation:powderFly .85s cubic-bezier(.2,.7,.4,1) forwards;
  opacity:.95;
}
@keyframes powderFly{
  0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(.25) rotate(var(--rot));opacity:0}
}

/* 答对时光晕 */
@keyframes glowPulse{
  0%{box-shadow:0 0 0 0 rgba(111,207,168,.55)}
  70%{box-shadow:0 0 0 14px rgba(111,207,168,0)}
  100%{box-shadow:0 0 0 0 rgba(111,207,168,0)}
}
.opt.right::before{animation:pop .3s, glowPulse .65s ease-out}

/* 错误态：改成温柔的浅橙，不用刺眼的红，也不抖动 */
.opt.wrong{color:#C98A6A}
.opt.wrong::before{
  background:
    repeating-linear-gradient(100deg, rgba(255,255,255,.5) 0px, rgba(255,240,228,.35) 3px, rgba(255,255,255,.45) 6px),
    linear-gradient(135deg,#FFF3E8,#FFE8D6);
  border-color:#F5C9A8;
  box-shadow:3px 3px 0 rgba(245,201,168,.35);
  animation:none;
}

/* 自动进入下一题的倒计时环 */
.autonext{
  display:inline-block;margin-left:8px;font-size:12.5px;font-weight:700;
  color:#54C79B;opacity:.85;
}

/* 结算 */
.res-title{font-size:25px;font-weight:800;text-align:center;margin-bottom:8px;color:#F0954A}
.res-score{
  font-size:54px;font-weight:800;text-align:center;line-height:1.1;margin-bottom:4px;
  color:#FF7FA8;
  text-shadow:2px 2px 0 #fff,4px 4px 0 rgba(255,182,201,.5),5px 5px 0 rgba(107,91,115,.08);
}
.res-label{text-align:center;font-size:13px;color:var(--ink-l);margin-bottom:22px;font-weight:700}
.res-stats{display:flex;gap:10px;margin-bottom:18px}
.wrong-list{max-height:220px;overflow-y:auto;margin-bottom:16px}
.wrong-item{
  background:#FFF5F7;border:2px solid #FFD0DF;border-radius:12px;
  padding:11px 13px;margin-bottom:8px;font-size:13.5px;line-height:1.5;
}
.wrong-item .wq{color:var(--ink-l);margin-bottom:3px;font-weight:700}
.wrong-item .wa{color:#D45B5B;font-weight:800}
.tip{text-align:center;font-size:12px;color:#B5A9BD;margin-top:14px;line-height:1.7}

/* 页面内操作反馈条 */
.toast{
  margin:10px 0 0;padding:11px 14px;border-radius:13px 10px 14px 11px;
  font-size:13px;font-weight:700;line-height:1.5;
  background:linear-gradient(135deg,#E4FBF0,#D2F5E4);
  border:2.5px solid #6FCFA8;color:#2E8B62;
  animation:toastIn .35s ease;
}
.toast.warn{
  background:linear-gradient(135deg,#FFF9E8,#FFF3D6);
  border-color:#F5D98A;color:#A8802E;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.hidden{display:none!important}

/* 错题本 */
.wb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.wb-title{font-size:20px;font-weight:800;color:#F0954A}
.wb-list{max-height:60vh;overflow-y:auto}
.wb-item{
  background:#FFF9F0;border:2px solid #FFE0BC;border-radius:13px;
  padding:11px 13px;margin-bottom:8px;font-size:13.5px;line-height:1.5;
}
.wb-item .wq{color:var(--ink);margin-bottom:3px;font-weight:700}
.wb-item .wa{color:#2E8B62;font-weight:800}
.wb-item .wc{font-size:11px;color:#B5A9BD;margin-top:4px}
.wb-empty{text-align:center;color:#B5A9BD;font-size:14px;padding:40px 0;line-height:1.8}
</style>
</head>
<body>
<!-- 蜡笔手绘滤镜：让直边变成不规则手绘边 -->
<svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
  <defs>
    <filter id="cr-rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.028" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="cr-rough-sm">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.05" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="cr-rough-lg">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="3" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div class="app">

  <!-- 首页 -->
  <div class="card" id="home">
    <div class="title">化学闯关</div>
    <div class="sub" id="subline">人教版九年级化学上册 · 每局 10 题约 1 分钟</div>
    <div class="stat-row">
      <div class="stat"><div class="n" id="s-total">0</div><div class="l">累计答题</div></div>
      <div class="stat"><div class="n" id="s-acc">—</div><div class="l">正确率</div></div>
      <div class="stat"><div class="n" id="s-best">0</div><div class="l">最高连击</div></div>
    </div>
    <div class="sect">选择范围</div>
    <div class="chips" id="unit-chips"></div>
    <div class="sect">掌握情况 <span style="float:right;font-weight:400;color:#a3aebb">点类别专项练 ›</span></div>
    <div class="rule" id="rule"></div>
    <div class="keys" id="keys"></div>
    <div id="toast"></div>
    <button class="btn" id="start">开始闯关</button>
    <button class="btn ghost" id="open-wb">错题本</button>
    <button class="btn ghost" id="reset-mastered">重置掌握记录</button>
    <button class="btn ghost" id="reset">清空全部记录</button>
    <div class="tip">答错的题会很快再出现<br>答对的题会慢慢退场</div>
  </div>

const META = {"u1":{"name":"第一单元","desc":"走进化学世界"},"u2":{"name":"第二单元","desc":"空气和氧气"},"u3":{"name":"第三单元","desc":"物质构成的奥秘"},"u4":{"name":"第四单元","desc":"自然界的水"},"u5":{"name":"第五单元","desc":"化学反应的定量关系"},"u6":{"name":"第六单元","desc":"碳和碳的氧化物"},"u7":{"name":"第七单元","desc":"能源的合理利用与开发"},"base":{"name":"基础复习","desc":"元素符号 · 化学式 · 化合价"}};

const ROUND = 10;
const LS = "chemquest_v2";
const MASTER_AT = 1;      // 答对几次算「掌握」（答错即撤销）
const MAX_CONF = 3;       // 熟练度上限（1=掌握，0=未掌握）
const UNIT_NAME = {};
for (const k of Object.keys(META)) UNIT_NAME[k] = META[k].name;

/* ---------- 组装题库 ---------- */
const QUESTIONS = [];
let _id = 0;
for (const unit of Object.keys(BANK)) {
  for (const q of BANK[unit]) {
    QUESTIONS.push({ id: _id++, unit: unit, cat: q.cat, q: q.q, a: q.a, opts: q.opts, why: q.why || "" });
  }
}
const ALL_UNITS = Object.keys(BANK);

let state = {
  stats: { total: 0, right: 0, best: 0 },
  conf: {},
  unit: null,
  focus: null,   // 专项练习的类别名；null = 不限
  wrong: {}
};
function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw){ const d = JSON.parse(raw);
      state.stats = d.stats || state.stats;
      state.conf = d.conf || {};
      state.unit = d.unit || "u3";
      state.focus = d.focus || null;
      state.wrong = d.wrong || {};
    }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify({stats:state.stats, conf:state.conf, unit:state.unit, focus:state.focus, wrong:state.wrong})); }catch(e){}
}
load();
QUESTIONS.forEach(q=>{ if(state.conf[q.id]===undefined) state.conf[q.id]=0; });
if(!state.unit || !BANK[state.unit]) state.unit = ALL_UNITS[0];

const $ = s => document.querySelector(s);
const home=$("#home"), game=$("#game"), result=$("#result"), wbPage=$("#wb");

function poolFor(unit, focus){
  let pool = QUESTIONS;
  if(unit && unit !== "all") pool = pool.filter(q=>q.unit === unit);
  if(focus) pool = pool.filter(q=>q.cat === focus);
  return pool;
}
function activePool(){
  return poolFor(state.unit, state.focus);
}

/* ---------- 首页 ---------- */
function renderHome(){
  $("#s-total").textContent = state.stats.total;
  $("#s-acc").textContent = state.stats.total ? Math.round(state.stats.right/state.stats.total*100)+"%" : "—";
  $("#s-best").textContent = state.stats.best;
  const chipBox = $("#unit-chips");
  const units = Object.keys(BANK);
  const want = units.concat(["all"]);
  chipBox.innerHTML = want.map(u=>{
    const label = u === "all" ? "全部" : (META[u] ? META[u].name : u);
    return '<button class="chip'+(u===state.unit?' on':'')+'" data-unit="'+u+'">'+label+'</button>';
  }).join("");
  chipBox.querySelectorAll(".chip").forEach(b=>{
    b.onclick = ()=>{ state.unit = b.dataset.unit; state.focus = null; save(); renderHome(); };
  });
  // 明确标注判定规则，避免误解
  const ruleEl = $("#rule");
  if (ruleEl) {
    ruleEl.innerHTML = '答对一次即记为<b>已掌握</b>，答错则撤销。'
      + '已掌握的题会自动退出练习，想重练请用下方「<b>重置掌握记录</b>」。'
      + '数字 <b>x / y</b> 中 x=已掌握，y=该类别总题数。';
  }
  const pool = poolFor(state.unit);
  const kc = {};
  pool.forEach(q=>{ kc[q.cat]=(kc[q.cat]||0)+1; });
  const cats = Object.keys(kc).sort((a,b)=>kc[b]-kc[a]);
  $("#keys").innerHTML = cats.map(c=>{
    const mastered = pool.filter(q=>q.cat===c && state.conf[q.id]>=MASTER_AT).length;
    const unseen = pool.filter(q=>q.cat===c && (state.conf[q.id]||0) < MASTER_AT).length;
    const pct = Math.round(mastered/kc[c]*100);
    const on = state.focus === c ? ' on' : '';
    return '<button class="key'+on+'" data-cat="'+c+'">'
      + '<div class="t">'+c+'</div>'
      + '<div class="v">'+mastered+' / '+kc[c]+'</div>'
      + '<div class="d">待练 '+unseen+' 题</div>'
      + '<i class="bar2" style="width:'+pct+'%"></i>'
      + '</button>';
  }).join("");
  $("#keys").querySelectorAll(".key").forEach(b=>{
    b.onclick = ()=>{
      const c = b.dataset.cat;
      state.focus = (state.focus === c) ? null : c;
      save(); renderHome();
    };
  });
  // 开始按钮文案 + 待练不足提示
  const sbtn = $("#start");
  if (sbtn) sbtn.textContent = state.focus ? ('专项练习：' + state.focus) : "开始闯关";
  const subEl = $("#subline");
  if (subEl) {
    const total = activePool().length;
    const left = activePool().filter(q => (state.conf[q.id]||0) < MASTER_AT).length;
    if (left === 0) {
      subEl.innerHTML = '本范围 <b>已全部掌握</b> · 可用「重置掌握记录」重新练';
    } else if (left < ROUND) {
      subEl.innerHTML = '待练仅剩 <b>' + left + '</b> 题（不足一局）· 掌握后可用「重置掌握记录」';
    } else {
      subEl.textContent = '待练 ' + left + ' / ' + total + ' 题 · 每局 10 题约 1 分钟';
    }
  }
}

/* ---------- 选题：熟练度越低越优先 ---------- */
function pickQuestions(n){
  let src = activePool();
  // 优先只练未掌握的；全掌握了再练全部
  const unmastered = src.filter(q => (state.conf[q.id]||0) < MASTER_AT);
  if (unmastered.length >= n) {
    src = unmastered;
  } else if (unmastered.length > 0) {
    src = unmastered;   // 不足一局也只用未掌握的，避免重复
  }
  const pool = src.map(q=>{
    const c = state.conf[q.id] || 0;
    let w = Math.max(1, 6 - c);
    if(c >= 4) w = 0.6;
    if(state.wrong[q.id]) w += 2;
    return { q, w: w * (0.6 + Math.random()) };
  });
  pool.sort((a,b)=> b.w - a.w);
  const chosen = [];
  const usedCat = {};
  const catCount = new Set(src.map(q=>q.cat)).size || 1;
  const cap = Math.ceil(n/Math.min(catCount,4)) + 2;
  for(const p of pool){
    if(chosen.length >= n) break;
    const c = p.q.cat;
    if((usedCat[c]||0) >= cap) continue;
    chosen.push(p.q);
    usedCat[c] = (usedCat[c]||0)+1;
  }
  // 名额没满时补齐
  if(chosen.length < n){
    for(const p of pool){
      if(chosen.length >= n) break;
      if(!chosen.includes(p.q)) chosen.push(p.q);
    }
  }
  for(let i=chosen.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [chosen[i],chosen[j]]=[chosen[j],chosen[i]]; }
  return chosen;
}

/* ---------- 开局 ---------- */
let cur = { list:[], idx:0, right:0, wrong:0, combo:0, maxCombo:0, wrongList:[], locked:false, score:0 };
let roundToken = 0;   // 每局唯一令牌，用于作废过期的自动跳转定时器

function startRound(){
  roundToken++;                     // 作废上一局所有待触发的定时器
  const avail = activePool().length;
  const list = pickQuestions(Math.min(ROUND, avail));
  cur = { list, idx:0, right:0, wrong:0, combo:0, maxCombo:0, wrongList:[], locked:false, score:0 };
  home.classList.add("hidden"); result.classList.add("hidden"); wbPage.classList.add("hidden");
  game.classList.remove("hidden");
  renderQ();
}

function renderQ(){
  const q = cur.list[cur.idx];
  cur.locked = false;
  $("#pn").textContent = cur.idx+1;
  $("#pt").textContent = cur.list.length;
  $("#bar").style.width = (cur.idx/cur.list.length*100)+"%";
  $("#cat").textContent = UNIT_NAME[q.unit] + " · " + q.cat;
  $("#qtext").textContent = q.q;
  $("#combo").classList.toggle("on", cur.combo >= 2);
  $("#cn").textContent = cur.combo;
  $("#fb").className = "fb";
  $("#fb").textContent = "";
  $("#next").classList.add("hidden");
  const box = $("#opts");
  box.innerHTML = "";
  q.opts.forEach(o=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o;
    b.onclick = ()=> answer(b, o, q);
    box.appendChild(b);
  });
}

function answer(btn, chosen, q){
  if(cur.locked) return;
  cur.locked = true;
  const right = (chosen === q.a);
  const all = [...document.querySelectorAll(".opt")];
  all.forEach(el=>{
    el.disabled = true;
    if(el.textContent === q.a) el.classList.add("right");
    else if(el.textContent === chosen) el.classList.add("wrong");
    else el.classList.add("dim");
  });

  // 取按钮位置，用于粉末爆发
  const rect = btn.getBoundingClientRect();
  const px = rect.left + rect.width / 2;
  const py = rect.top + rect.height / 2;

  state.stats.total++;
  if(right){
    cur.right++; state.stats.right++;
    cur.combo++; cur.maxCombo = Math.max(cur.maxCombo, cur.combo);
    state.stats.best = Math.max(state.stats.best, cur.maxCombo);
    state.conf[q.id] = MASTER_AT;   // 答对即掌握
    delete state.wrong[q.id];
    const gained = 10 + Math.min(cur.combo-1,5)*2;
    cur.score += gained;

    // 粉末效果：答对爆一波，连击越高越多
    powderBurst(px, py, null, cur.combo >= 3 ? 60 : 42);
    floatText("+" + gained);

    const fb = $("#fb");
    fb.className = "fb ok show";
    let praise = "✓ 正确";
    if(cur.combo >= 5) praise = "🌟 太棒了！连对 " + cur.combo;
    else if(cur.combo >= 3) praise = "🔥 连对 " + cur.combo + "！";
    else if(cur.combo === 2) praise = "👍 又对了！";
    fb.innerHTML = "<b>" + praise + "</b>"
      + (q.why ? '<span class="why">' + q.why + '</span>' : '');

    // 自动进入下一题：先停顿让人确认，再跳
    const nb = $("#next");
    nb.classList.add("hidden");
    const last = (cur.idx === cur.list.length - 1);
    const waitMs = 1000;
    const tip = document.createElement("div");
    tip.className = "autonext";
    tip.textContent = (last ? "即将查看结果" : "即将进入下一题") + "…";
    $("#fb").appendChild(tip);
    const myToken = roundToken;
    setTimeout(() => {
      if(myToken !== roundToken) return;   // 已换局/已退出，放弃本次自动跳转
      if(last) showResult(); else nextQ();
    }, waitMs);
  } else {
    cur.wrong++;
    cur.combo = 0;
    state.conf[q.id] = 0;           // 答错即撤销掌握
    state.wrong[q.id] = { q:q.q, a:q.a, cat:q.cat, unit:q.unit, n:(state.wrong[q.id]?(state.wrong[q.id].n||1):0)+1 };
    cur.wrongList.push({q:q.q, a:q.a, why:q.why});
    const fb = $("#fb");
    fb.className = "fb no show";
    fb.innerHTML = "<b>再看一眼</b>　正确答案：<b>" + q.a + "</b>"
      + (q.why ? '<span class="why">' + q.why + '</span>' : '');

    // 答错：不自动跳，等手动点
    const nb = $("#next");
    nb.classList.remove("hidden");
    nb.textContent = (cur.idx === cur.list.length-1) ? "看结果" : "下一题";
    nb.onclick = nextQ;
  }
  save();
  $("#combo").classList.toggle("on", cur.combo >= 2);
  $("#cn").textContent = cur.combo;
  $("#bar").style.width = ((cur.idx+1)/cur.list.length*100)+"%";

  if(navigator.vibrate) navigator.vibrate(right ? 6 : 18);
}

function nextQ(){
  cur.idx++;
  if(cur.idx >= cur.list.length) showResult();
  else renderQ();
}

/* 首页提示条 */
let toastTimer = null;
function showToast(msg, warn){
  const box = document.getElementById('toast');
  if (!box) return;
  box.innerHTML = '<div class="toast' + (warn ? ' warn' : '') + '">' + msg + '</div>';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    box.innerHTML = '';
  }, 3200);
}

/* 蜡笔粉末爆开 */
function powderBurst(x, y, colors, count){
  // 高饱和 + 马卡龙混合调色盘，随机取色
  const palette = colors || [
    '#FF6FA0','#FF8FB1','#FFB6C9','#FFD1DE',
    '#FFA85C','#FFC48C','#FFD9A8','#FFEDC7',
    '#5FB3F0','#7FBBEB','#A9D3F5','#CFE6FA',
    '#40C79B','#6FCFA8','#B8E8D8','#8ED9C4',
    '#FFE066','#FFD93D','#FFF0B3',
    '#B48CF2','#D9CBF5','#E85A8A','#3AAEE0'
  ];
  const n = count || 42;
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'powder';
    // 更均匀的圆周分布 + 抖动，避免明显同心圆
    const ang = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.85;
    const dist = 40 + Math.random() * 145;
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    d.style.background = palette[(Math.random() * palette.length) | 0];
    // 随机大小：少量大颗粒 + 多数小颗粒，更像蜡笔屑
    const big = Math.random() < 0.22;
    const sz = big ? (8 + Math.random() * 8) : (3.5 + Math.random() * 5);
    d.style.width = sz.toFixed(1) + 'px';
    d.style.height = (sz * (0.65 + Math.random() * 0.7)).toFixed(1) + 'px';
    d.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
    d.style.setProperty('--dy', (Math.sin(ang) * dist + 40).toFixed(1) + 'px');
    d.style.setProperty('--rot', ((Math.random() - 0.5) * 900).toFixed(0) + 'deg');
    d.style.animationDuration = (0.55 + Math.random() * 0.6).toFixed(2) + 's';
    d.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1400);
  }
}

function floatText(t){
  const d = document.createElement("div");
  d.className = "floater";
  d.textContent = t;
  d.style.left = (window.innerWidth/2 - 20) + "px";
  d.style.top = (window.innerHeight/2 - 40) + "px";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 800);
}

/* ---------- 结算 ---------- */
function showResult(){
  game.classList.add("hidden"); result.classList.remove("hidden");
  const n = cur.list.length;
  const pct = n ? Math.round(cur.right/n*100) : 0;
  $("#rscore").textContent = cur.score;
  let title = "继续加油";
  if(pct === 100) title = "全对！太棒了";
  else if(pct >= 80) title = "很不错！";
  else if(pct >= 60) title = "有进步空间";
  $("#rtitle").textContent = title;
  $("#rlabel").textContent = (state.focus ? "【"+state.focus+"】专项　" : "") + "本局答对 "+cur.right+" / "+n+"　正确率 "+pct+"%";
  $("#r-right").textContent = cur.right;
  $("#r-wrong").textContent = cur.wrong;
  $("#r-combo").textContent = cur.maxCombo;

  const wl = $("#wrongs");
  if(cur.wrongList.length === 0){
    wl.innerHTML = "";
  } else {
    wl.innerHTML = '<div style="font-size:12px;color:#93a0b0;margin-bottom:7px">本局错题（会再次出现）</div>'
      + cur.wrongList.map(w=>'<div class="wrong-item"><div class="wq">'+w.q+'</div><div class="wa">→ '+w.a+'</div></div>').join("");
  }
}

/* ---------- 错题本 ---------- */
function openWrongBook(){
  home.classList.add("hidden"); game.classList.add("hidden"); result.classList.add("hidden");
  wbPage.classList.remove("hidden");
  const rows = Object.keys(state.wrong).map(k=>state.wrong[k]);
  rows.sort((a,b)=> (b.n||0)-(a.n||0));
  if(rows.length === 0){
    $("#wb-list").innerHTML = '<div class="wb-empty">还没有错题<br>连对几局就会出现空白</div>';
    return;
  }
  $("#wb-list").innerHTML = rows.map(r=>
    '<div class="wb-item"><div class="wq">'+r.q+'</div><div class="wa">→ '+r.a+'</div>'
    + '<div class="wc">'+(UNIT_NAME[r.unit]||"")+' · '+r.cat+(r.n>1?'　错 '+r.n+' 次':'')+'</div></div>'
  ).join("");
}

/* ---------- 事件 ---------- */
$("#start").onclick = startRound;
$("#again").onclick = startRound;
$("#quit").onclick = ()=>{ roundToken++; game.classList.add("hidden"); home.classList.remove("hidden"); renderHome(); };
$("#home-btn").onclick = ()=>{ roundToken++; result.classList.add("hidden"); home.classList.remove("hidden"); renderHome(); };
$("#open-wb").onclick = openWrongBook;
$("#wb-back").onclick = ()=>{ wbPage.classList.add("hidden"); home.classList.remove("hidden"); renderHome(); };
$("#reset-mastered").onclick = ()=>{
  const pool = activePool();
  const masteredCount = pool.filter(q => (state.conf[q.id]||0) >= MASTER_AT).length;
  const scope = state.focus
    ? ('【' + state.focus + '】专项')
    : (state.unit === "all" ? "全部范围" : (META[state.unit] ? META[state.unit].name : state.unit));

  // 没有可重置的题：用页面提示，而不是一闪而过的 alert
  if (masteredCount === 0) {
    showToast('「' + scope + '」还没有已掌握的题，无需重置。<br>先去练几道吧，答对就会记为掌握。', true);
    return;
  }

  if (!confirm("将 " + scope + " 的 " + masteredCount + " 道已掌握题目全部重新加入练习？\n\n（答题统计和错题本不受影响）")) {
    showToast('已取消重置。', true);
    return;
  }

  pool.forEach(q => { state.conf[q.id] = 0; });
  save(); renderHome();
  showToast('已重置「' + scope + '」的 ' + masteredCount + ' 道题，全部重新加入练习。<br>现在待练 ' + pool.length + ' 题。');
};

$("#reset").onclick = ()=>{
  const totalMastered = QUESTIONS.filter(q => (state.conf[q.id]||0) >= MASTER_AT).length;
  const totalWrong = Object.keys(state.wrong).length;
  const totalAnswered = state.stats.total;

  if (totalAnswered === 0 && totalMastered === 0 && totalWrong === 0) {
    showToast('还没有任何记录，无需清空。', true);
    return;
  }

  if (!confirm(
    "确定清空全部记录？\n\n"
    + "· 已掌握：" + totalMastered + " 题\n"
    + "· 错题本：" + totalWrong + " 题\n"
    + "· 累计答题：" + totalAnswered + " 次\n\n"
    + "清空后无法恢复。"
  )) {
    showToast('已取消清空。', true);
    return;
  }

  state.stats = {total:0, right:0, best:0};
  state.conf = {}; state.wrong = {}; state.focus = null;
  QUESTIONS.forEach(q => state.conf[q.id] = 0);
  save(); renderHome();
  showToast('已清空全部记录：掌握 ' + totalMastered + ' 题、错题本 ' + totalWrong + ' 题、统计归零。');
};

renderHome();
</script>
